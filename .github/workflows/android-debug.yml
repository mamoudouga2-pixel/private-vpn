name: Build PRIVATE VPN Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PRIVATE-VPN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: private-vpn-apk
          path: PRIVATE-VPN.apk
      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PRIVATE-VPN.apk \
            --title "PRIVATE VPN - latest build" \
            --notes "Download PRIVATE-VPN.apk below and install it on an Android phone." \
            --target "$GITHUB_SHA"
